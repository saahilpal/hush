<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hush for Gmail — Settings</title>
  <style>
    :root {
      --ink: #1b2236;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --line: #e6e8ed;
      --blue: #3d4fd6;
      --green: #0f9d75;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--ink);
      background: var(--panel);
      width: 320px;
      padding: 16px;
    }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--blue); }
    button {
      width: 100%;
      padding: 7px 12px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
    }
    .status.success { color: var(--green); }
    .status.error { color: #d32f2f; }
  </style>
</head>
<body>
  <h2>Hush for Gmail Settings</h2>
  <div class="form-group">
    <label for="worker-url">Worker URL</label>
    <input type="text" id="worker-url" placeholder="https://hush.subdomain.workers.dev">
  </div>
  <div class="form-group">
    <label for="api-token">API Token</label>
    <input type="password" id="api-token" placeholder="Bearer API_TOKEN">
  </div>
  <button id="btn-save">Save & grant permission</button>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
